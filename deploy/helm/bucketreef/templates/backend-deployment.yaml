{{- $backendReplicas := int (.Values.backend.replicas | default 1) -}}
{{- $backendAccessMode := lower (toString (.Values.backend.persistence.accessMode | default "ReadWriteOnce")) -}}
{{- $deploymentProfile := include "bucketreef.deploymentProfile" . -}}
{{- if not (has $deploymentProfile (list "full" "admin" "user" "ceph-admin-high-security")) -}}
{{- fail "deploymentProfile must be one of: full, admin, user, ceph-admin-high-security." -}}
{{- end -}}
{{- if and (has $deploymentProfile (list "user" "ceph-admin-high-security")) (or .Values.billingCronJob.enabled .Values.healthcheckCronJob.enabled .Values.quotaMonitorCronJob.enabled .Values.usageHistoryCronJob.enabled .Values.notificationRetentionCronJob.enabled) -}}
{{- fail (printf "deploymentProfile=%s cannot own scheduled jobs; enable CronJobs only on the admin/full release." $deploymentProfile) -}}
{{- end -}}
{{- if ne $deploymentProfile "full" -}}
{{- range $featureName := list "CEPH_ADMIN_HIGH_SECURITY_MODE" "FEATURE_ADMIN_ENABLED" "FEATURE_CEPH_ADMIN_ENABLED" "FEATURE_STORAGE_OPS_ENABLED" "FEATURE_MANAGER_ENABLED" "FEATURE_PORTAL_ENABLED" "FEATURE_BROWSER_ENABLED" "SCHEDULED_JOBS_ENABLED" -}}
{{- if hasKey $.Values.backend.env $featureName -}}
{{- fail (printf "%s is controlled by deploymentProfile=%s and must not be set in backend.env." $featureName $deploymentProfile) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- if not .Values.backend.existingSecret -}}
{{- fail "backend.existingSecret is required and must reference an existing authentication secret." -}}
{{- end -}}
{{- if not .Values.ingress.enabled -}}
{{- fail "ingress.enabled=true is required for the production security profile." -}}
{{- end -}}
{{- if not .Values.ingress.tls -}}
{{- fail "ingress.tls must reference an existing TLS secret." -}}
{{- end -}}
{{- if not .Values.backend.trustedProxyCidrs -}}
{{- fail "backend.trustedProxyCidrs is required and must contain the exact ingress/reverse-proxy CIDR boundary." -}}
{{- end -}}
{{- range $secretName := list "DATABASE_URL" "UI_JWT_KEYS" "API_JWT_KEYS" "CREDENTIAL_KEYS" "INTERNAL_CRON_TOKEN" "SMTP_PASSWORD" -}}
{{- if hasKey $.Values.backend.env $secretName -}}
{{- fail (printf "%s must be supplied through backend.existingSecret, not backend.env." $secretName) -}}
{{- end -}}
{{- end -}}
{{- if hasKey .Values.backend.env "TRUSTED_PROXY_CIDRS" -}}
{{- fail "TRUSTED_PROXY_CIDRS must be configured with backend.trustedProxyCidrs, not backend.env." -}}
{{- end -}}
{{- if and (gt $backendReplicas 1) (ne (lower .Values.backend.databaseType) "postgresql") -}}
{{- fail "backend.replicas > 1 requires backend.databaseType=postgresql." -}}
{{- end -}}
{{- if and (gt $backendReplicas 1) .Values.backend.persistence.enabled (ne $backendAccessMode "readwritemany") -}}
{{- fail "backend.replicas > 1 cannot use backend.persistence with ReadWriteOnce; disable backend.persistence.enabled or set backend.persistence.accessMode=ReadWriteMany." -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bucketreef.fullname" . }}-backend
  labels:
    {{- include "bucketreef.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        {{- include "bucketreef.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.backend.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          image: "{{ .Values.image.backend.repository }}:{{ default .Chart.AppVersion .Values.image.backend.tag }}"
          imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          ports:
            - containerPort: 8000
              name: http
          env:
            {{- range $key, $value := .Values.backend.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if eq $deploymentProfile "admin" }}
            - name: FEATURE_ADMIN_ENABLED
              value: "true"
            - name: FEATURE_CEPH_ADMIN_ENABLED
              value: "true"
            - name: FEATURE_STORAGE_OPS_ENABLED
              value: "true"
            - name: FEATURE_MANAGER_ENABLED
              value: "false"
            - name: FEATURE_PORTAL_ENABLED
              value: "false"
            - name: FEATURE_BROWSER_ENABLED
              value: "false"
            - name: SCHEDULED_JOBS_ENABLED
              value: "true"
            {{- else if eq $deploymentProfile "user" }}
            - name: FEATURE_ADMIN_ENABLED
              value: "false"
            - name: FEATURE_CEPH_ADMIN_ENABLED
              value: "false"
            - name: FEATURE_STORAGE_OPS_ENABLED
              value: "false"
            - name: FEATURE_MANAGER_ENABLED
              value: "true"
            - name: FEATURE_PORTAL_ENABLED
              value: "true"
            - name: FEATURE_BROWSER_ENABLED
              value: "true"
            - name: SCHEDULED_JOBS_ENABLED
              value: "false"
            {{- else if eq $deploymentProfile "ceph-admin-high-security" }}
            - name: CEPH_ADMIN_HIGH_SECURITY_MODE
              value: "true"
            - name: FEATURE_ADMIN_ENABLED
              value: "false"
            - name: FEATURE_CEPH_ADMIN_ENABLED
              value: "true"
            - name: FEATURE_STORAGE_OPS_ENABLED
              value: "false"
            - name: FEATURE_MANAGER_ENABLED
              value: "false"
            - name: FEATURE_PORTAL_ENABLED
              value: "false"
            - name: FEATURE_BROWSER_ENABLED
              value: "false"
            - name: SCHEDULED_JOBS_ENABLED
              value: "false"
            {{- end }}
            - name: TRUSTED_PROXY_CIDRS
              value: {{ .Values.backend.trustedProxyCidrs | toJson | quote }}
            {{- if not (hasKey .Values.backend.env "BACKEND_REPLICAS") }}
            - name: BACKEND_REPLICAS
              value: {{ .Values.backend.replicas | quote }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.databaseUrl | quote }}
            - name: UI_JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.uiJwtKeys | quote }}
            - name: API_JWT_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.apiJwtKeys | quote }}
            - name: CREDENTIAL_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.credentialKeys | quote }}
            {{- if has $deploymentProfile (list "full" "admin") }}
            - name: INTERNAL_CRON_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.internalCronToken | quote }}
            {{- end }}
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.backend.existingSecret | quote }}
                  key: {{ .Values.backend.secretKeys.smtpPassword | quote }}
                  optional: true
            {{- range .Values.backend.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- if .Values.backend.persistence.enabled }}
            - name: data
              mountPath: /data
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host | quote }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ .Values.ingress.host | quote }}
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if .Values.backend.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "bucketreef.fullname" . }}-backend
      {{- end }}
