{{- if and .Values.bucketUsageStatsCronJob.enabled (eq (include "bucketreef.scheduledJobsEnabled" .) "true") }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "bucketreef.fullname" . }}-bucket-usage-stats
  labels:
    {{- include "bucketreef.labels" . | nindent 4 }}
    app.kubernetes.io/component: bucket-usage-stats-cron
spec:
  schedule: {{ .Values.bucketUsageStatsCronJob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: {{ .Values.bucketUsageStatsCronJob.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.bucketUsageStatsCronJob.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.bucketUsageStatsCronJob.backoffLimit }}
      template:
        metadata:
          labels:
            {{- include "bucketreef.labels" . | nindent 12 }}
            app.kubernetes.io/component: bucket-usage-stats-cron
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            {{- toYaml .Values.cronJobs.podSecurityContext | nindent 12 }}
          containers:
            - name: bucket-usage-stats-collector
              image: "{{ .Values.image.backend.repository }}:{{ default .Chart.AppVersion .Values.image.backend.tag }}"
              imagePullPolicy: {{ .Values.image.backend.pullPolicy }}
              securityContext:
                {{- toYaml .Values.cronJobs.containerSecurityContext | nindent 16 }}
              resources:
                {{- toYaml .Values.cronJobs.resources | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              env:
                - name: BUCKET_USAGE_STATS_API_BASE
                  value: {{ printf "http://%s-backend:%d" (include "bucketreef.fullname" .) (.Values.service.backend.port | int) | quote }}
                - name: INTERNAL_CRON_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.backend.existingSecret | quote }}
                      key: {{ .Values.backend.secretKeys.internalCronToken | quote }}
                {{- range .Values.bucketUsageStatsCronJob.extraEnv }}
                - name: {{ .name }}
                  value: {{ .value | quote }}
                {{- end }}
              command: ["/bin/sh", "-c"]
              args:
                - |
                  python - <<'PY'
                  import os
                  import sys
                  import requests

                  base = os.environ.get("BUCKET_USAGE_STATS_API_BASE")
                  token = os.environ.get("INTERNAL_CRON_TOKEN")
                  if not base or not token:
                      print("Missing BUCKET_USAGE_STATS_API_BASE or INTERNAL_CRON_TOKEN", file=sys.stderr)
                      sys.exit(1)
                  url = f"{base}/api/internal/bucket-usage-stats/collect"
                  resp = requests.post(url, headers={"X-Internal-Token": token}, timeout=86400)
                  print(f"Bucket usage statistics collection returned HTTP {resp.status_code}")
                  resp.raise_for_status()
                  PY
          volumes:
            - name: tmp
              emptyDir: {}
{{- end }}
