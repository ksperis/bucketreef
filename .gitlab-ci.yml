# Contributions execute on GitHub; only protected refs enter private CI.
workflow:
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED != "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_PIPELINE_SOURCE == "push" && ($CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "dev")'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main" && $CI_MODE =~ /^(qualify|docs|recover-release)$/'
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $CI_COMMIT_BRANCH == "main" && $CI_MODE =~ /^(regression|security|secrets-history)$/'
    - when: never
stages: [plan, run]
variables:
  CI_MODE: auto
  GIT_DEPTH: "0"
plan:
  stage: plan
  image: python:3.12-slim
  tags: [bucketreef-protected]
  environment:
    name: ci-orchestration
    action: verify
  before_script:
    - apt-get update && apt-get install --yes --no-install-recommends git
    - python3 -m pip install -r ops/ci/requirements.txt
  script:
    - python3 ops/ci/events.py gitlab
  artifacts:
    paths: [ci-plan.json, ci-child.yml]
    expire_in: 30 days
run-selected:
  stage: run
  needs: [plan]
  trigger:
    include:
      - artifact: ci-child.yml
        job: plan
    strategy: depend
    forward:
      yaml_variables: false
      pipeline_variables: false
