.docs-rules:
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true" || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "main"'
    - changes:
        - doc/**/*
        - README.md
        - frontend/scripts/docs-screenshots/**/*
        - ops/cloudflare/**/*
        - ops/ci/docs.gitlab-ci.yml
        - .gitlab-ci.yml

docs-build:
  extends: .docs-rules
  stage: build
  image: python:3.11-bookworm
  needs: []
  interruptible: true
  variables:
    GIT_DEPTH: "0"
  before_script:
    - python -m pip install -r doc/requirements.txt
  script:
    - python -m mkdocs build -f doc/mkdocs.yml --strict
  artifacts:
    name: docs-$CI_COMMIT_SHA
    paths:
      - doc/site/
    expire_in: 30 days

docs-screenshots:
  extends: .docs-rules
  stage: test
  image: node:24-bookworm
  needs: []
  interruptible: true
  script:
    - node frontend/scripts/docs-screenshots/check.mjs

docs-deploy:
  stage: deploy
  image: node:24-bookworm
  needs:
    - job: docs-build
      artifacts: true
    - job: docs-screenshots
      artifacts: false
  resource_group: cloudflare-docs-production
  interruptible: false
  environment:
    name: docs-production
    url: https://docs.bucketreef.ksperis.com
    deployment_tier: production
  rules:
    - if: '$SECRET_DETECTION_HISTORIC_SCAN == "true" || $CI_COMMIT_TAG'
      when: never
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_COMMIT_REF_PROTECTED == "true" && $CI_PIPELINE_SOURCE == "push"'
      changes:
        - doc/**/*
        - README.md
        - frontend/scripts/docs-screenshots/**/*
        - ops/cloudflare/**/*
        - ops/ci/docs.gitlab-ci.yml
        - .gitlab-ci.yml
  before_script:
    - npm ci --prefix ops/cloudflare --no-audit --no-fund
  script:
    - test -n "$CLOUDFLARE_ACCOUNT_ID"
    - test -n "$CLOUDFLARE_API_TOKEN"
    - |
      current_main=$(git ls-remote origin refs/heads/main | cut -f1)
      if [ "$current_main" != "$CI_COMMIT_SHA" ]; then
        echo "Refusing to deploy an outdated main commit."
        exit 1
      fi
    - ops/cloudflare/node_modules/.bin/wrangler pages deploy doc/site --project-name=bucketreef-docs --branch=main --commit-hash="$CI_COMMIT_SHA"
