docs-deploy:
  stage: deploy
  image: node:24.21.0-bookworm
  needs:
  - docs-build
  - docs-screenshots
  resource_group: cloudflare-docs-production
  interruptible: false
  environment:
    name: docs-production
    url: https://docs.bucketreef.ksperis.com
    deployment_tier: production
  before_script:
  - npm ci --prefix ops/cloudflare --no-audit --no-fund
  script:
  - test -n "$CLOUDFLARE_ACCOUNT_ID"
  - test -n "$CLOUDFLARE_API_TOKEN"
  - |
    for asset in bucketreef-compose.tar.gz bucketreef-quickstart.tar.gz; do
      curl --fail --silent --show-error --head --location "https://github.com/ksperis/bucketreef/releases/latest/download/$asset"
      curl --fail --silent --show-error --head --location "https://github.com/ksperis/bucketreef/releases/latest/download/$asset.sha256"
    done
  - |
    current_main=$(git ls-remote origin refs/heads/main | cut -f1)
    if [ "$current_main" != "$CI_COMMIT_SHA" ]; then
      echo "Refusing to deploy an outdated main commit."
      exit 1
    fi
  - ops/cloudflare/node_modules/.bin/wrangler pages deploy doc/site --project-name=bucketreef-docs --branch=main
    --commit-hash="$CI_COMMIT_SHA"
