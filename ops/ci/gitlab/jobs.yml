.trivy-job:
  image:
    name: $TRIVY_IMAGE
    entrypoint:
    - ''
  cache:
    key: trivy-cache
    paths:
    - .trivycache/
  before_script:
  - trivy --version
  - mkdir -p gl-security-reports
  artifacts:
    when: always
    expire_in: 1 week
project-naming:
  stage: test
  image: python:3.12-slim
  needs: []
  before_script:
  - apt-get update
  - apt-get install --yes --no-install-recommends git
  script:
  - sh ops/ci/tasks/run.sh project-naming
helm-contract:
  stage: test
  image:
    name: alpine/helm:3.18.6
    entrypoint:
    - ''
  needs: []
  script:
  - sh ops/ci/tasks/run.sh helm-contract
compose-contract:
  stage: test
  image: docker:27-cli
  needs: []
  before_script:
  - apk add --no-cache jq
  script:
  - sh ops/ci/tasks/run.sh compose-contract
.promote-internal-image:
  stage: promote
  image:
    name: $REGISTRY_TOOLS_IMAGE
    entrypoint:
    - ''
  before_script:
  - apk add --no-cache skopeo jq
  script:
  - test -n "$SOURCE_IMAGE"
  - sh ops/ci/verify-image-platforms.sh "$SOURCE_IMAGE"
  - test -n "$TARGET_GITLAB_IMAGE"
  - "source_digest=$(skopeo inspect --creds \"$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD\" --format '{{.Digest}}' \"\
    docker://$SOURCE_IMAGE\")\nfor tag in dev \"dev-$CI_COMMIT_SHORT_SHA\"; do\n  gitlab_target=\"docker://$TARGET_GITLAB_IMAGE:$tag\"\
    \n\n  skopeo copy --all --preserve-digests \\\n    --src-creds \"$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD\" \\\
    \n    --dest-creds \"$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD\" \\\n    \"docker://$SOURCE_IMAGE\" \\\n    \"\
    $gitlab_target\"\n\n  gitlab_digest=$(skopeo inspect --creds \"$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD\" --format\
    \ '{{.Digest}}' \"$gitlab_target\")\n  test \"$gitlab_digest\" = \"$source_digest\"\ndone\n"
.promote-public-image:
  stage: promote
  image:
    name: $REGISTRY_TOOLS_IMAGE
    entrypoint:
    - ''
  before_script:
  - apk add --no-cache skopeo jq git coreutils
  script:
  - test -n "$SOURCE_IMAGE"
  - sh ops/ci/verify-image-platforms.sh "$SOURCE_IMAGE"
  - test -n "$TARGET_GHCR_IMAGE"
  - test -n "$GHCR_USERNAME"
  - test -n "$GHCR_TOKEN"
  - test -n "$RELEASE_GHCR_TAGS"
  - "if [ \"$PROMOTION_KIND\" != \"release\" ]; then\n  echo \"Unsupported PROMOTION_KIND: $PROMOTION_KIND\"\n \
    \ exit 1\nfi\ncurrent_tags=\"$(sh ops/release/image-tags.sh \"$RELEASE_VERSION\")\"\npromotion_tags=\"$(printf\
    \ '%s' \"$current_tags\" | tr ',' ' ')\"\nif [ -z \"$promotion_tags\" ]; then\n  echo \"Release promotion requires\
    \ at least one GHCR tag\"\n  exit 1\nfi\n"
  - "source_digest=$(skopeo inspect --creds \"$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD\" --format '{{.Digest}}' \"\
    docker://$SOURCE_IMAGE\")\nfor tag in $promotion_tags; do\n  ghcr_target=\"docker://$TARGET_GHCR_IMAGE:$tag\"\
    \n\n  if [ \"$tag\" = \"$RELEASE_VERSION\" ]; then\n    if existing_digest=$(skopeo inspect --creds \"$GHCR_USERNAME:$GHCR_TOKEN\"\
    \ --format '{{.Digest}}' \"$ghcr_target\" 2>/tmp/bucketreef-registry-error); then\n      if [ \"$existing_digest\"\
    \ != \"$source_digest\" ]; then\n        echo \"Refusing to overwrite published release image $tag\"\n     \
    \   exit 1\n      fi\n    elif ! grep -Eiq 'manifest unknown|name unknown|not found|404' /tmp/bucketreef-registry-error;\
    \ then\n      cat /tmp/bucketreef-registry-error >&2\n      exit 1\n    fi\n  fi\n  skopeo copy --all --preserve-digests\
    \ \\\n    --src-creds \"$CI_REGISTRY_USER:$CI_REGISTRY_PASSWORD\" \\\n    --dest-creds \"$GHCR_USERNAME:$GHCR_TOKEN\"\
    \ \\\n    \"docker://$SOURCE_IMAGE\" \\\n    \"$ghcr_target\"\n\n  ghcr_digest=$(skopeo inspect --creds \"$GHCR_USERNAME:$GHCR_TOKEN\"\
    \ --format '{{.Digest}}' \"$ghcr_target\")\n  test \"$ghcr_digest\" = \"$source_digest\"\ndone\n"
release-tag-metadata:
  stage: test
  image: python:3.12-slim
  needs: []
  variables:
    GIT_DEPTH: '0'
  before_script:
  - apt-get update && apt-get install --yes --no-install-recommends coreutils git
  - case "$CI_COMMIT_TAG" in v0.*.1) python3 -m pip install -r backend/requirements.txt ;; esac
  script:
  - "release_tag=\"${CI_COMMIT_TAG:-}\"\nif ! printf '%s\\n' \"$release_tag\" | grep -Eq '^v[0-9]+\\.[0-9]+\\.[0-9]+$';\
    \ then\n  echo \"Release tag must match vX.Y.Z\"\n  exit 1\nfi\n\nrelease_version=\"${release_tag#v}\"\nrelease_minor=\"\
    ${release_version%.*}\"\npython3 ops/release/check_version.py \"$release_version\"\npython3 ops/release/schema_baseline.py\
    \ \"$release_version\" --check\ngit fetch --quiet origin \"$CI_DEFAULT_BRANCH\"\nif ! git merge-base --is-ancestor\
    \ \"$CI_COMMIT_SHA\" FETCH_HEAD; then\n  echo \"Release tag must point to a commit included in $CI_DEFAULT_BRANCH\"\
    \n  exit 1\nfi\n\nghcr_tags=\"$(sh ops/release/image-tags.sh \"$release_version\")\"\npython3 ops/release/release_notes.py\
    \ --version \"$release_version\"\n\n{\n  printf 'RELEASE_VERSION=%s\\n' \"$release_version\"\n  printf 'RELEASE_MINOR=%s\\\
    n' \"$release_minor\"\n  printf 'RELEASE_GHCR_TAGS=%s\\n' \"$ghcr_tags\"\n} > release-tags.env\necho \"Release\
    \ GHCR tags: $(printf '%s' \"$ghcr_tags\" | tr ',' ' ')\"\n"
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - release-tags.env
    - dist/release-notes/
    reports:
      dotenv: release-tags.env
backend-tests:
  stage: test
  image: python:3.12-slim
  before_script:
  - apt-get update && apt-get install --yes --no-install-recommends git
  - pip install -r backend/requirements-test.txt
  - mkdir -p gl-test-reports
  - for var in $(env | cut -d= -f1 | grep '^OIDC_PROVIDERS__' || true); do unset "$var"; done
  - export OIDC_PROVIDERS="{}"
  script:
  - sh ops/ci/tasks/run.sh backend-tests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - gl-test-reports/backend-junit.xml
    reports:
      junit: gl-test-reports/backend-junit.xml
backend-postgresql-tests:
  stage: test
  image: python:3.12-slim
  services:
  - name: postgres:16-alpine
    alias: postgres
  needs: []
  variables:
    POSTGRES_DB: bucketreef_bootstrap_test
    POSTGRES_USER: bucketreef
    POSTGRES_PASSWORD: bucketreef-test-password
    DATABASE_URL: postgresql://bucketreef:bucketreef-test-password@postgres:5432/bucketreef_bootstrap_test
    POSTGRES_TEST_DATABASE_URL: postgresql://bucketreef:bucketreef-test-password@postgres:5432/bucketreef_bootstrap_test
    APP_ENV: test
    OIDC_PROVIDERS: '{}'
    LDAP_PROVIDERS: '{}'
  before_script:
  - apt-get update
  - apt-get install --yes --no-install-recommends postgresql-client
  - pip install -r backend/requirements-test.txt
  - mkdir -p gl-test-reports
  - for var in $(env | cut -d= -f1 | grep '^OIDC_PROVIDERS__' || true); do unset "$var"; done
  - for var in $(env | cut -d= -f1 | grep '^LDAP_PROVIDERS__' || true); do unset "$var"; done
  - export OIDC_PROVIDERS="{}"
  - export LDAP_PROVIDERS="{}"
  script:
  - sh ops/ci/tasks/run.sh backend-postgresql-tests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - gl-test-reports/backend-postgresql-junit.xml
    reports:
      junit: gl-test-reports/backend-postgresql-junit.xml
backend-deadcode:
  stage: test
  image: python:3.12-slim
  needs: []
  before_script:
  - pip install -r backend/requirements-test.txt
  script:
  - sh ops/ci/tasks/run.sh backend-deadcode
backend-vuln-scan:
