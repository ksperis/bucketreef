docs-build:
  stage: build
  image: python:3.11-bookworm
  needs: []
  interruptible: true
  variables:
    GIT_DEPTH: '0'
  before_script:
  - python -m pip install -r doc/requirements.txt
  script:
  - sh ops/ci/tasks/run.sh docs-build
  artifacts:
    name: docs-$CI_COMMIT_SHA
    paths:
    - doc/site/
    expire_in: 30 days
docs-screenshots:
  stage: test
  image: node:24-bookworm
  needs: []
  interruptible: true
  script:
  - sh ops/ci/tasks/run.sh docs-screenshots
docs-deploy:
  stage: deploy
  image: node:24-bookworm
  needs:
  - docs-build
  - docs-screenshots
  resource_group: cloudflare-docs-production
  interruptible: false
  environment:
    name: docs-production
    url: https://docs.bucketreef.ksperis.com
    deployment_tier: production
  before_script:
  - npm ci --prefix ops/cloudflare --no-audit --no-fund
  script:
  - test -n "$CLOUDFLARE_ACCOUNT_ID"
  - test -n "$CLOUDFLARE_API_TOKEN"
  - "for asset in bucketreef-compose.tar.gz bucketreef-quickstart.tar.gz; do\n  curl --fail --silent --show-error\
    \ --head --location \"https://github.com/ksperis/bucketreef/releases/latest/download/$asset\"\n  curl --fail\
    \ --silent --show-error --head --location \"https://github.com/ksperis/bucketreef/releases/latest/download/$asset.sha256\"\
    \ndone\n"
  - "current_main=$(git ls-remote origin refs/heads/main | cut -f1)\nif [ \"$current_main\" != \"$CI_COMMIT_SHA\"\
    \ ]; then\n  echo \"Refusing to deploy an outdated main commit.\"\n  exit 1\nfi\n"
  - ops/cloudflare/node_modules/.bin/wrangler pages deploy doc/site --project-name=bucketreef-docs --branch=main
    --commit-hash="$CI_COMMIT_SHA"
ci-contract:
  stage: test
  image: python:3.12-slim
  before_script:
  - python3 -m pip install -r ops/ci/requirements.txt
  script:
  - sh ops/ci/tasks/run.sh ci-contract
secret-scan:
  stage: test
  image:
    name: $SECRET_ANALYZER_IMAGE
    entrypoint:
    - ''
  before_script:
  - apk add --no-cache python3
  script:
  - sh ops/ci/tasks/secret-scan.sh
  artifacts:
    when: always
    paths:
    - gl-security-reports/secrets-redacted.json
    expire_in: 1 week
integration-ready:
  stage: evidence
  image: python:3.12-slim
  environment:
    name: ci-orchestration
    action: verify
  script:
