    reports:
      junit: gl-test-reports/frontend-junit.xml
frontend-browser-e2e:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  needs: []
  variables:
    E2E_S3_ENDPOINT: http://localhost:5000
    E2E_S3_ACCESS_KEY: minio
    E2E_S3_SECRET_KEY: minio123
    E2E_START_MOTO: 'true'
    E2E_MOTO_COMMAND: ../backend/.venv/bin/moto_server -H 0.0.0.0 -p 5000
    S3_IGNORE_SUBDOMAIN_BUCKETNAME: 'true'
  before_script:
  - mkdir -p gl-test-reports
  - for var in $(env | cut -d= -f1 | grep '^OIDC_PROVIDERS__' || true); do unset "$var"; done
  - export OIDC_PROVIDERS="{}"
  - "if ! command -v python3 >/dev/null 2>&1; then\n  apt-get update\n  apt-get install -y python3\nfi\nif ! python3\
    \ -m ensurepip --version >/dev/null 2>&1; then\n  apt-get update\n  PYTHON_VENV_PACKAGE=\"python$(python3 -c\
    \ 'import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")')-venv\"\n  apt-get install -y\
    \ \"$PYTHON_VENV_PACKAGE\"\nfi\n"
  - python3 -m venv backend/.venv
  - backend/.venv/bin/python -m pip install -r backend/requirements-browser-e2e.txt
  - npm ci --prefix frontend --no-audit --no-fund
  script:
  - sh ops/ci/tasks/run.sh frontend-browser-e2e
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - gl-test-reports/frontend-browser-e2e-junit.xml
    - frontend/playwright-report/
    - frontend/test-results/
    reports:
      junit: gl-test-reports/frontend-browser-e2e-junit.xml
frontend-vuln-scan:
  extends: .trivy-job
  stage: test
  needs: []
  script:
  - sh ops/ci/tasks/run.sh frontend-vuln-scan
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - gl-security-reports/frontend-dependencies-trivy.json
    - gl-security-reports/frontend-sbom.cdx.json
ceph-functional-tests:
  stage: test
  image: python:3.12-slim
  needs: []
  allow_failure: false
  retry: 0
  before_script:
  - pip install -r backend/requirements-test.txt
  - mkdir -p gl-test-reports
  script:
  - cd backend
  - PYTHONPATH=. python tests_ceph_functional/run_ci.py -q -ra --junit-xml=../gl-test-reports/ceph-functional-junit.xml
  - python ../ops/ci/ceph_result.py ../gl-test-reports/ceph-functional-junit.xml
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - gl-test-reports/ceph-functional-junit.xml
    - gl-test-reports/ceph-functional-backend.log
    reports:
      junit: gl-test-reports/ceph-functional-junit.xml
  environment:
    name: ci-ceph
    action: verify
  resource_group: ceph-functional-lab
build-backend:
  extends: .multiarch-build
  variables:
    IMAGE_COMPONENT: backend
build-frontend:
  extends: .multiarch-build
  variables:
    IMAGE_COMPONENT: frontend
build-scheduler:
  extends: .multiarch-build
  variables:
    IMAGE_COMPONENT: scheduler
helm-kind-onboarding-smoke:
  stage: security
  image: docker:27-cli
  services:
  - docker:27-dind
  needs:
  - build-backend
  - build-frontend
  variables:
    KIND_VERSION: v0.27.0
    KIND_API_HOST: docker
    KIND_SMOKE_PRUNE_SOURCE_IMAGES: 'true'
    BACKEND_IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE/backend
    FRONTEND_IMAGE_REPOSITORY: $CI_REGISTRY_IMAGE/frontend
    IMAGE_TAG: $CI_COMMIT_SHA
  before_script:
  - apk add --no-cache bash curl helm jq kubectl openssl
  - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  - curl --fail --silent --show-error --location --output /tmp/kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
  - curl --fail --silent --show-error --location --output /tmp/kind.sha256sum "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64.sha256sum"
  - echo "$(awk '{print $1}' /tmp/kind.sha256sum)  /tmp/kind" | sha256sum -c
  - install -m 0755 /tmp/kind /usr/local/bin/kind
  script:
  - bash ops/ci/kind-onboarding-smoke.sh
release-source-images-ready:
  stage: build
  image:
    name: $REGISTRY_TOOLS_IMAGE
    entrypoint:
    - ''
  needs:
  - job: release-tag-metadata
    artifacts: true
  variables:
    RELEASE_SOURCE_IMAGE_RETRIES: '60'
    RELEASE_SOURCE_IMAGE_RETRY_SECONDS: '30'
  before_script:
  - apk add --no-cache skopeo jq
  script:
  - echo "Release qualification migration is not installed" >&2
  - exit 1
backend-image-vuln-scan:
  extends: .multiarch-image-scan
  stage: security
  needs:
  - build-backend
  variables:
    IMAGE_COMPONENT: backend
    SCAN_KIND: image
frontend-image-vuln-scan:
  extends: .multiarch-image-scan
