release-tag-metadata:
  stage: test
  image: python:3.12-slim
  needs: []
  variables:
    GIT_DEPTH: '0'
  before_script:
  - apt-get update && apt-get install --yes --no-install-recommends coreutils git
  - case "$CI_COMMIT_TAG" in v0.*.1) python3 -m pip install -r backend/requirements.txt ;; esac
  script:
  - |-
    release_tag="${CI_COMMIT_TAG:-}"
    if ! printf '%s\n' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
      echo "Release tag must match vX.Y.Z"
      exit 1
    fi

    release_version="${release_tag#v}"
    release_minor="${release_version%.*}"
    python3 ops/release/check_version.py "$release_version"
    python3 ops/release/schema_baseline.py "$release_version" --check
    git fetch --quiet origin "$CI_DEFAULT_BRANCH"
    if ! git merge-base --is-ancestor "$CI_COMMIT_SHA" FETCH_HEAD; then
      echo "Release tag must point to a commit included in $CI_DEFAULT_BRANCH"
      exit 1
    fi

    python3 ops/release/release_notes.py --version "$release_version"

    {
      printf 'RELEASE_VERSION=%s\n' "$release_version"
      printf 'RELEASE_MINOR=%s\n' "$release_minor"
    } > release-tags.env
  artifacts:
    when: always
    expire_in: never
    paths:
    - release-tags.env
    - dist/release-notes/
    reports:
      dotenv: release-tags.env
backend-tests:
