  image: python:3.12-alpine
  needs:
  - job: release-tag-metadata
    artifacts: true
  script:
  - python3 ops/release/package_bundles.py --version "$RELEASE_VERSION"
  artifacts:
    expire_in: 30 days
    paths:
    - dist/release/
publish-helm-release:
  stage: deploy
  image:
    name: alpine/helm:3.18.6
    entrypoint:
    - ''
  needs:
  - job: release-tag-metadata
    artifacts: true
  - job: release-bundles
    artifacts: true
  - promote-backend-release
  - promote-frontend-release
  - promote-scheduler-release
