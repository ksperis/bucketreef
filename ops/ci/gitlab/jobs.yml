    - gl-security-reports/backend-dependencies-trivy.json
    - gl-security-reports/backend-sbom.cdx.json
frontend-quality:
  stage: test
  image: node:24-bookworm
  needs: []
  script:
  - sh ops/ci/tasks/run.sh frontend-quality
  before_script:
  - npm ci --prefix frontend --no-audit --no-fund
frontend-tests:
  stage: test
  image: node:24-bookworm
  needs: []
  before_script:
  - npm ci --prefix frontend --no-audit --no-fund
  script:
  - sh ops/ci/tasks/run.sh frontend-tests
  artifacts:
    when: always
    expire_in: 1 week
    paths:
