  resource_group: build-$CI_COMMIT_SHA-$IMAGE_COMPONENT
  image: docker:27-cli
  services:
  - docker:27-dind
  before_script:
  - apk add --no-cache jq
  - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login --username "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
  - sh ops/ci/build-image.sh
.multiarch-image-scan:
  extends: .trivy-job
  stage: security
  parallel:
    matrix:
    - IMAGE_ARCH:
      - amd64
      - arm64
  script:
  - sh ops/ci/scan-image.sh
  artifacts:
    when: always
    expire_in: 1 week
    paths:
    - gl-security-reports/
.release-rules: {}
release-bundles:
