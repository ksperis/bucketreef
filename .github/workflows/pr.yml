name: Public CI
'on':
  pull_request:
    branches:
    - main
    - dev
  merge_group:
    types:
    - checks_requested
permissions:
  contents: read
concurrency:
  group: public-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
        persist-credentials: false
    - id: plan
      run: python3 ops/ci/events.py github
  project-naming:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'project-naming') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: project-naming
  ci-contract:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'ci-contract') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: ci-contract
  secret-scan:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'secret-scan') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: secret-scan
  backend-tests:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'backend-tests') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: backend-tests
  backend-security-contract:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'backend-security-contract') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: backend-security-contract
  backend-postgresql-tests:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'backend-postgresql-tests') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: backend-postgresql-tests
  backend-deadcode:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'backend-deadcode') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: backend-deadcode
  backend-vuln-scan:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'backend-vuln-scan') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: backend-vuln-scan
  frontend-quality:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'frontend-quality') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: frontend-quality
  frontend-audit:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'frontend-audit') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: frontend-audit
  frontend-tests:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'frontend-tests') }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - shard: 1/2
          artifact_suffix: -1-of-2
        - shard: 2/2
          artifact_suffix: -2-of-2
    uses: ./.github/workflows/validate-task.yml
    with:
      task: frontend-tests
      shard: ${{ matrix.shard }}
      artifact_suffix: ${{ matrix.artifact_suffix }}
  frontend-browser-e2e:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'frontend-browser-e2e') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: frontend-browser-e2e
  frontend-vuln-scan:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'frontend-vuln-scan') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: frontend-vuln-scan
  helm-contract:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'helm-contract') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: helm-contract
  compose-contract:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'compose-contract') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: compose-contract
  docs-build:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'docs-build') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: docs-build
  docs-screenshots:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'docs-screenshots') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: docs-screenshots
  frontend-demo:
    needs: [plan]
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'frontend-demo') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: frontend-demo
  required:
    name: CI / required
    if: ${{ always() }}
    needs:
    - plan
    - project-naming
    - ci-contract
    - secret-scan
    - backend-tests
    - backend-security-contract
    - backend-postgresql-tests
    - backend-deadcode
    - backend-vuln-scan
    - frontend-quality
    - frontend-audit
    - frontend-tests
    - frontend-browser-e2e
    - frontend-demo
    - frontend-vuln-scan
    - helm-contract
    - compose-contract
    - docs-build
    - docs-screenshots
    - scheduler-contract
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Require every selected validation
      env:
        CI_NEEDS_JSON: ${{ toJSON(needs) }}
      run: python3 ops/ci/required.py
  scheduler-contract:
    needs:
    - plan
    if: ${{ contains(fromJSON(needs.plan.outputs.jobs), 'scheduler-contract') }}
    uses: ./.github/workflows/validate-task.yml
    with:
      task: scheduler-contract
