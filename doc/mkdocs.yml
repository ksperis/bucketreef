INHERIT: mkdocs.base.yml

site_name: BucketReef Documentation
site_description: BucketReef documentation guide selector and release history
site_url: https://docs.bucketreef.ksperis.com/
docs_dir: docs
site_dir: site
edit_uri: edit/main/doc/docs/

# Global pages are intentionally outside every guide search index.
plugins:
  - git-revision-date-localized:
      enable_creation_date: false
      enable_git_follow: false
      strict: false

exclude_docs: |
  admin/**
  browser/**
  developer/**
  manager/**
  portal/**

nav:
  - Documentation: index.md
  - Releases: releases.md
