site_author: BucketReef contributors
repo_name: BucketReef
repo_url: https://github.com/ksperis/bucketreef

theme:
  name: material
  language: en
  font: false
  logo: /assets/brand/bucketreef-mark-256.png
  favicon: /assets/brand/bucketreef-mark-256.png
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
  palette:
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - /assets/stylesheets/docs-theme.css
  - /assets/stylesheets/screenshots-gallery.css

extra_javascript:
  - /assets/javascripts/screenshots-gallery.js
