INHERIT: mkdocs.base.yml

site_name: BucketReef Administration Guide
site_description: Deploy, configure, secure and operate BucketReef and its storage integrations
site_url: https://docs.bucketreef.ksperis.com/admin/en/
docs_dir: docs/admin/en
site_dir: site/admin/en
edit_uri: edit/main/doc/docs/admin/en/

